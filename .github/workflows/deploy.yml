
name: Deploy Website on EC2 Runner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Runner Information
        run: |
          echo "GitHub Actions is running on AWS EC2!"
          echo "Runner deployment started successfully."

      - name: Prepare Website
        run: |
          mkdir -p "$HOME/website"
          cp index.html "$HOME/website/index.html"
          echo "Website files copied successfully."

      - name: Show Deployment Status
        run: |
          echo "Website deployment files are ready."
          ls -l "$HOME/website"
