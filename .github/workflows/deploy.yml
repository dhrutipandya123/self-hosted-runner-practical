
name: Build and Deploy CloudDeploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t dhruti2005/clouddeploy:latest .

      - name: Push Docker Image
        run: |
          docker push dhruti2005/clouddeploy:latest

      - name: Deploy Container on EC2
        run: |
          docker rm -f clouddeploy || true
          docker run -d \
            --name clouddeploy \
            --restart unless-stopped \
            -p 8080:80 \
            dhruti2005/clouddeploy:latest

      - name: Verify Container
        run: |
          docker ps
          curl -f http://localhost:8080/
